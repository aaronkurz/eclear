[project]
name = "eclear"
version = "0.1.0"
description = "Event and case log enrichment widget for Python notebooks"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Kurz" }]
keywords = ["process-mining", "event-log", "case-log", "anywidget", "marimo", "jupyter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Framework :: Jupyter",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "anywidget>=0.11,<0.12",
    "traitlets>=5.14",
]

[project.urls]
Homepage = "https://github.com/aaronkurz/eclear"
Repository = "https://github.com/aaronkurz/eclear"
Issues = "https://github.com/aaronkurz/eclear/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eclear"]

[tool.hatch.build.targets.sdist]
include = [
    "eclear",
    "js/src",
    "js/build.mjs",
    "js/package.json",
    "js/package-lock.json",
    "js/tsconfig.json",
    "tests",
    "README.md",
    "LICENSE",
    "PUBLISHING.md",
]
exclude = ["**/node_modules", "**/__pycache__", "js/coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
